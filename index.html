<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" data-keep="">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" data-keep="">
<title data-keep="">Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com" data-keep="">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" data-keep="">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600&amp;family=IBM+Plex+Sans+Thai:wght@300;400;500;600&amp;family=Anuphan:wght@400;500;600&amp;display=swap" rel="stylesheet" data-keep="">
<style data-keep="">
:root{
  --bg:#F1F2EE; --surface:#FAFBF8; --ink:#1A2120; --muted:#65706B; --faint:#9AA39E; --line:#D6DBD4;
  --glass:rgba(255,255,255,.55); --glass-strong:rgba(255,255,255,.78); --glass-line:rgba(255,255,255,.75);
  --accent-2:color-mix(in oklab,var(--accent) 55%,#8FD3C8);
  --accent:#3346D3; --accent-soft:color-mix(in oklab, var(--accent) 12%, transparent);
  --display:"Bricolage Grotesque","Anuphan","IBM Plex Sans Thai",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai","Anuphan",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1); --ease-out:cubic-bezier(.16,1,.3,1);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121615; --surface:#181D1C; --ink:#E6EBE8; --muted:#95A09B; --faint:#66706B; --line:#2A3230; --glass:rgba(28,34,33,.55); --glass-strong:rgba(32,39,38,.82); --glass-line:rgba(255,255,255,.07);
    --accent:color-mix(in oklab, var(--accent-base, #3346D3) 62%, white); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121615; --surface:#181D1C; --ink:#E6EBE8; --muted:#95A09B; --faint:#66706B; --line:#2A3230; --glass:rgba(28,34,33,.55); --glass-strong:rgba(32,39,38,.82); --glass-line:rgba(255,255,255,.07);
  --accent:color-mix(in oklab, var(--accent-base, #3346D3) 62%, white); color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px); scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.7;
  -webkit-font-smoothing:antialiased;transition:background .5s var(--ease),color .5s var(--ease)}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
::selection{background:var(--accent);color:#fff}

/* ---------- Hero ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(20px,5vw,56px)}
.hero{min-height:88vh;min-height:88svh;display:grid;align-content:end;padding:clamp(64px,12vh,140px) 0 clamp(48px,8vh,88px);position:relative}
.hero-top{position:absolute;top:clamp(20px,4vh,40px);left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:14px;color:var(--muted)}
.avail{display:inline-flex;align-items:center;gap:10px}
.avail i{width:8px;height:8px;border-radius:50%;background:var(--accent);position:relative}
.avail i::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--accent);animation:ping 2.4s var(--ease-out) infinite}
@keyframes ping{0%{transform:scale(1);opacity:.6}80%,100%{transform:scale(3.2);opacity:0}}
.hero-grid{display:grid;grid-template-columns:1fr auto;gap:clamp(28px,5vw,80px);align-items:center}
.name{font-family:var(--display);font-weight:500;font-size:clamp(52px,11vw,152px);line-height:.92;letter-spacing:-.045em;margin:0 0 .28em;
  font-variation-settings:"opsz" 96}
.name .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em;margin-bottom:-.08em}
.name .w>span{display:inline-block;transform:translateY(105%);transition:transform 1.1s var(--ease-out)}
.loaded .name .w>span{transform:none}
.role{font-family:var(--display);font-size:clamp(20px,2.4vw,30px);font-weight:400;letter-spacing:-.015em;margin:0;color:var(--ink);
  display:flex;align-items:center;gap:14px}
.role::before{content:"";width:0;height:2px;background:var(--accent);transition:width 1s .7s var(--ease-out)}
.loaded .role::before{width:clamp(28px,4vw,56px)}
.intro{max-width:34em;color:var(--muted);margin:22px 0 0;font-size:clamp(16px,1.4vw,18px);font-weight:300}
.fade{opacity:0;transform:translateY(14px);transition:opacity .9s var(--ease-out),transform .9s var(--ease-out)}
.loaded .fade{opacity:1;transform:none}
.photo-wrap{position:relative;width:clamp(210px,25vw,330px);aspect-ratio:1;flex:none;justify-self:end}
.photo-wrap::before{content:"";position:absolute;inset:-12%;border-radius:50%;background:radial-gradient(circle,color-mix(in oklab,var(--accent) 22%,transparent),transparent 65%);filter:blur(24px);opacity:0;transition:opacity 1.4s .6s}
.loaded .photo-wrap::before{opacity:1}
.photo{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:var(--glass);border:6px solid var(--glass-strong);
  box-shadow:0 30px 60px -30px color-mix(in oklab,var(--accent) 55%,rgba(0,0,0,.4));clip-path:circle(0% at 50% 50%);transition:clip-path 1.4s .35s var(--ease-out)}
.loaded .photo{clip-path:circle(50% at 50% 50%)}
.photo img{width:100%;height:100%;object-fit:cover;transform:scale(1.18);transition:transform 1.9s .35s var(--ease-out)}
.loaded .photo img{transform:scale(1)}
.photo .ini{position:absolute;inset:0;display:grid;place-items:center;font:500 clamp(56px,7vw,96px)/1 var(--display);letter-spacing:-.04em;color:var(--accent);
  background:linear-gradient(145deg,var(--b1,#CFE3FF),var(--b3,#E6DCFF) 60%,var(--b4,#FFE4D6))}
.photo-ring{position:absolute;inset:-18px;border-radius:50%;border:1.5px dashed color-mix(in oklab,var(--accent) 45%,transparent);opacity:0;transition:opacity 1s 1.3s;animation:spin 48s linear infinite}
.photo-ring::after{content:"";position:absolute;top:-6px;left:50%;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 0 0 4px var(--glass-strong)}
.loaded .photo-ring{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
.contact-row{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:34px;font-size:15px}
.contact-row a,.contact-row span{color:var(--ink);text-decoration:none;position:relative;padding-bottom:2px}
.contact-row span{color:var(--muted)}
.ul{background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .45s var(--ease-out)}
.ul:hover{background-size:100% 1px}
.scroll-cue{position:absolute;bottom:22px;left:0;font-size:13px;color:var(--faint);display:flex;align-items:center;gap:10px}
.scroll-cue b{width:1px;height:34px;background:var(--line);position:relative;overflow:hidden;display:block}
.scroll-cue b::after{content:"";position:absolute;left:0;top:-40%;width:1px;height:40%;background:var(--ink);animation:drip 2.2s var(--ease) infinite}
@keyframes drip{to{top:110%}}

/* ---------- Body layout ---------- */
.body{display:grid;grid-template-columns:200px minmax(0,1fr);gap:clamp(32px,6vw,96px);padding-bottom:40px;border-top:1px solid var(--line)}
.index{position:sticky;top:calc(env(safe-area-inset-top,0px) + 40px);align-self:start;padding-top:56px}
.index ol{list-style:none;margin:0;padding:0 0 0 16px;position:relative;border-left:1px solid var(--line)}
.index li a{display:block;padding:6px 0;font-size:14px;color:var(--muted);text-decoration:none;transition:color .3s,transform .4s var(--ease-out)}
.index li a:hover{color:var(--ink)}
.index li a.on{color:var(--ink);transform:translateX(4px)}
.index .mark{position:absolute;left:-1.5px;top:0;width:2px;height:28px;background:var(--accent);border-radius:2px;
  transition:transform .55s var(--ease-out),height .55s var(--ease-out)}
.content{min-width:0;max-width:720px}
.sec{padding:56px 0 24px}
.sec-h{font-family:var(--display);font-weight:500;font-size:clamp(26px,3vw,36px);letter-spacing:-.025em;line-height:1.1;margin:0 0 32px;
  display:flex;align-items:baseline;gap:14px}
.sec-h small{font-family:var(--body);font-size:13px;color:var(--faint);font-weight:400;letter-spacing:0}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .9s var(--ease-out),transform .9s var(--ease-out)}
.reveal.in{opacity:1;transform:none}
.static .reveal{transition:none}

.prose p{margin:0 0 1em;font-size:clamp(18px,1.7vw,21px);line-height:1.65;font-weight:300;max-width:36em}
.prose p:first-child{color:var(--ink)}

/* timeline */
.tl{position:relative;padding-left:28px}
.tl::before,.tl::after{content:"";position:absolute;left:4px;top:8px;bottom:8px;width:1px;background:var(--line)}
.tl::after{background:var(--accent);transform-origin:top;transform:scaleY(var(--p,0));transition:transform .15s linear}
.tl-item{position:relative;display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 28px;padding:0 0 38px}
.tl-item::before{content:"";position:absolute;left:-28px;top:9px;width:9px;height:9px;border-radius:50%;background:var(--surface);
  border:1.5px solid var(--faint);transition:background .4s,border-color .4s,transform .5s var(--ease-out)}
.tl-item.hit::before{background:var(--accent);border-color:var(--accent);transform:scale(1.15)}
.tl-when{font-size:14px;color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums}
.tl-when span{display:block;color:var(--faint);font-size:13px}
.tl-t{margin:0;font-family:var(--display);font-weight:500;font-size:20px;letter-spacing:-.01em;line-height:1.3}
.tl-org{color:var(--muted);font-size:15px;margin:2px 0 10px}
.tl-body{margin:0;color:var(--muted);font-size:15.5px;white-space:pre-line}

/* projects */
.pj{border-top:1px solid var(--line)}
.pj-row{display:block;position:relative;border-bottom:1px solid var(--line);padding:22px 0 22px;text-decoration:none;color:inherit;isolation:isolate}
.pj-row::before{content:"";position:absolute;inset:0 -16px;background:var(--accent-soft);border-radius:10px;z-index:-1;
  transform:scaleY(0);transform-origin:bottom;transition:transform .5s var(--ease-out)}
.pj-row:hover::before,.pj-row:focus-visible::before{transform:scaleY(1)}
.pj-top{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.pj-t{margin:0;font-family:var(--display);font-weight:500;font-size:clamp(20px,2.2vw,26px);letter-spacing:-.02em;transition:transform .5s var(--ease-out)}
.pj-row:hover .pj-t{transform:translateX(8px)}
.pj-y{font-size:14px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
.pj-ico{display:inline-block;margin-left:8px;opacity:0;transform:translate(-6px,6px);transition:.5s var(--ease-out);color:var(--accent)}
.pj-row:hover .pj-ico{opacity:1;transform:none}
.pj-b{margin:8px 0 12px;color:var(--muted);font-size:15.5px;max-width:34em}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12.5px;padding:3px 11px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:var(--surface)}

/* skills */
.sk{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:30px 40px}
.sk h3{font-family:var(--display);font-weight:500;font-size:16px;margin:0 0 12px;letter-spacing:-.005em}
.sk ul{list-style:none;margin:0;padding:0}
.sk li{font-size:15.5px;color:var(--muted);padding:5px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.sk li::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--line);align-self:center;transition:background .3s,transform .4s var(--ease-out)}
.sk li:hover{color:var(--ink)}
.sk li:hover::after{background:var(--accent);transform:scale(1.4)}

/* footer */
.foot{padding:clamp(72px,12vh,140px) 0 56px;border-top:1px solid var(--line);margin-top:40px}
.foot p{color:var(--muted);margin:0 0 14px;font-size:15px}
.big-mail{font-family:var(--display);font-weight:500;font-size:clamp(30px,6.4vw,84px);letter-spacing:-.04em;line-height:1;text-decoration:none;
  display:inline-block;overflow-wrap:anywhere;color:var(--ink);transition:color .4s}
.big-mail:hover{color:var(--accent)}
.foot-row{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-top:56px;font-size:13px;color:var(--faint)}
.empty-note{color:var(--faint);font-size:15px;border:1px dashed var(--line);border-radius:12px;padding:18px}

/* ---------- Pastel background ---------- */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:var(--b0);transition:background 1s var(--ease)}
.bg i{position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(70px);opacity:.9;transition:background 1.2s var(--ease);will-change:transform}
.bg i:nth-child(1){background:var(--b1);left:-18vmax;top:-22vmax;animation:d1 26s ease-in-out infinite alternate}
.bg i:nth-child(2){background:var(--b2);right:-20vmax;top:-10vmax;animation:d2 32s ease-in-out infinite alternate}
.bg i:nth-child(3){background:var(--b3);left:10vmax;bottom:-30vmax;animation:d3 28s ease-in-out infinite alternate}
.bg i:nth-child(4){background:var(--b4);right:-10vmax;bottom:-26vmax;width:48vmax;height:48vmax;animation:d1 36s ease-in-out infinite alternate-reverse}
@keyframes d1{to{transform:translate(12vmax,10vmax) scale(1.12)}}
@keyframes d2{to{transform:translate(-14vmax,12vmax) scale(.9)}}
@keyframes d3{to{transform:translate(8vmax,-12vmax) scale(1.1)}}
:root[data-theme="dark"] .bg{background:var(--bg)}:root[data-theme="dark"] .bg i{opacity:.15}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bg{background:var(--bg)}:root:not([data-theme="light"]) .bg i{opacity:.15}}
.bgp{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:6px 0}
.bgp button{appearance:none;border:1px solid var(--line);border-radius:12px;padding:0;cursor:pointer;overflow:hidden;background:var(--surface);text-align:left;font:13px var(--body);color:var(--ink)}
.bgp button span{display:block;height:46px}
.bgp button em{display:block;font-style:normal;padding:6px 10px}
.bgp button.on{box-shadow:0 0 0 2px var(--ink)}

/* ---------- Gallery ---------- */
.gal{columns:3 220px;column-gap:14px}
.gi{display:block;width:100%;break-inside:avoid;margin:0 0 14px;padding:0;border:0;position:relative;border-radius:18px;overflow:hidden;cursor:zoom-in;background:var(--glass);
  box-shadow:0 16px 34px -24px rgba(20,30,28,.45)}
.gi img{width:100%;height:auto;transition:transform 1.1s var(--ease-out)}
.gi:hover img,.gi:focus-visible img{transform:scale(1.06)}
.gi .cap{position:absolute;left:0;right:0;bottom:0;padding:36px 14px 12px;color:#fff;font:500 14px/1.4 var(--body);text-align:left;
  background:linear-gradient(transparent,rgba(8,12,11,.62));transform:translateY(101%);transition:transform .55s var(--ease-out)}
.gi .cap small{display:block;font-weight:400;opacity:.8;font-size:12.5px}
.gi:hover .cap,.gi:focus-visible .cap{transform:none}
@media (hover:none){.gi .cap{transform:none}}
.reveal.in .gi{animation:gIn .9s var(--ease-out) both;animation-delay:calc(var(--k,0) * 80ms)}
.static .gi{animation:none!important}
@keyframes gIn{from{opacity:0;transform:translateY(24px) scale(.96)}}
.lb{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(10,14,13,.84);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  opacity:0;pointer-events:none;transition:opacity .45s var(--ease)}
.lb.open{opacity:1;pointer-events:auto}
.lb figure{margin:0;max-width:min(1100px,90vw);text-align:center;transform:scale(.94) translateY(10px);transition:transform .6s var(--ease-out)}
.lb.open figure{transform:none}
.lb img{max-height:78vh;max-height:78svh;width:auto;margin:0 auto;border-radius:14px;transition:opacity .3s}
.lb figcaption{color:#EDEFEA;margin-top:14px;font-size:15px}
.lb figcaption small{display:block;color:#A9B1AC;font-size:13px}
.lb button{position:absolute;width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;font-size:22px;cursor:pointer;
  display:grid;place-items:center;transition:background .25s}
.lb button:hover{background:rgba(255,255,255,.22)}
.lb .x{top:calc(18px + env(safe-area-inset-top,0px));right:18px}
.lb .pv{left:18px;top:50%;transform:translateY(-50%)}
.lb .nx{right:18px;top:50%;transform:translateY(-50%)}
.lb .cnt{position:absolute;top:calc(28px + env(safe-area-inset-top,0px));left:24px;color:#A9B1AC;font-size:13px}

/* ---------- Footer contacts ---------- */
.contacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:40px}
.contact{display:flex;align-items:center;gap:14px;padding:14px 18px 14px 14px;border-radius:20px;text-decoration:none;color:var(--ink);background:var(--glass);
  border:1px solid var(--glass-line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:transform .5s var(--ease-out),box-shadow .5s var(--ease-out),background .3s}
a.contact:hover{transform:translateY(-4px);background:var(--glass-strong);box-shadow:0 18px 34px -20px color-mix(in oklab,var(--accent) 60%,transparent)}
.contact .ci{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2));flex:none;transition:transform .6s var(--ease-out)}
a.contact:hover .ci{transform:rotate(-8deg) scale(1.06)}
.contact .ci svg{width:20px;height:20px}
.contact em{display:block;font-style:normal;font-size:12.5px;color:var(--muted);line-height:1.3}
.contact strong{display:block;font-weight:500;font-size:15.5px;line-height:1.45;overflow-wrap:anywhere;white-space:pre-line}
.contact.wide{grid-column:1/-1}
.dr-foot .dbtn.primary,.dbtn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}
label.add{display:block;text-align:center}
.gitem{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;padding-top:12px}
.gitem .row{grid-column:1/-1}
.gthumb{width:84px;height:84px;border-radius:12px;overflow:hidden;background:var(--line);display:grid;place-items:center;font-size:11px;color:var(--muted)}
.gthumb img{width:100%;height:100%;object-fit:cover}
.gitem .fld{margin:0 0 8px}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0 0;line-height:1.55}

.fb-wait #app{opacity:0}
.fb-wait::after{content:"";position:fixed;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
/* ---------- Toolbar ---------- */
.dock{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;
  display:flex;gap:4px;padding:5px;background:color-mix(in oklab,var(--surface) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:999px;box-shadow:0 10px 30px -12px rgba(20,30,28,.25);
  transition:transform .6s var(--ease-out),opacity .4s}
.dock.away{transform:translateY(140%);opacity:0}
.dbtn{appearance:none;border:0;background:transparent;color:var(--ink);font:500 14px/1 var(--body);padding:10px 14px;border-radius:999px;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;transition:background .25s}
.dbtn:hover{background:var(--accent-soft)}
.dbtn.primary{background:var(--ink);color:var(--bg)}
.dbtn.primary:hover{background:var(--accent);color:#fff}
.dbtn svg{width:16px;height:16px}

/* ---------- Editor drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,14,13,.28);z-index:48;opacity:0;pointer-events:none;transition:opacity .45s}
.editing .scrim{opacity:1;pointer-events:auto}
@media (min-width:1100px){ .editing .scrim{opacity:0;pointer-events:none} .editing #app{margin-right:440px} }
#app{transition:margin .6s var(--ease-out)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);z-index:50;background:var(--surface);border-left:1px solid var(--line);
  display:flex;flex-direction:column;transform:translateX(102%);transition:transform .6s var(--ease-out);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.editing .drawer{transform:none}
.dr-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.dr-head h2{margin:0;font:500 18px/1.2 var(--display)}
.dr-body{flex:1;overflow:auto;padding:14px 16px 40px;overscroll-behavior:contain}
.dr-foot{display:flex;gap:8px;padding:14px 16px;border-top:1px solid var(--line);background:var(--surface)}
.dr-foot .dbtn{flex:1;justify-content:center;border:1px solid var(--line)}
.dr-foot .dbtn.primary{border-color:transparent}
.dr-note{font-size:12.5px;color:var(--muted);padding:0 16px 10px;margin:0}

.grp{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;background:var(--bg);overflow:hidden}
.grp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:13px 14px;font-weight:500;font-size:15px}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary .chev{margin-left:auto;transition:transform .35s var(--ease-out);color:var(--faint)}
.grp[open]>summary .chev{transform:rotate(90deg)}
.grp>summary .kind{font-size:11.5px;color:var(--faint);font-weight:400;border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.grp>summary .hid{font-size:11.5px;color:var(--accent)}
.grp-in{padding:4px 14px 14px;animation:drop .4s var(--ease-out)}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}}
.fld{display:block;margin:10px 0}
.fld>span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.fld input,.fld textarea,.fld select{width:100%;font:15px/1.5 var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);
  border-radius:9px;padding:9px 11px;transition:border-color .2s,box-shadow .2s}
.fld textarea{min-height:88px;resize:vertical}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.item{border:1px solid var(--line);border-radius:11px;padding:4px 12px 10px;margin:10px 0;background:var(--surface);animation:pop .45s var(--ease-out)}
@keyframes pop{from{opacity:0;transform:scale(.97)}}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.ibtn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:6px 9px;font:13px/1 var(--body);cursor:pointer;
  transition:color .2s,border-color .2s,background .2s}
.ibtn:hover{color:var(--ink);border-color:var(--faint)}
.ibtn.danger:hover{color:#C23A2B;border-color:#C23A2B}
.ibtn:disabled{opacity:.35;cursor:default}
.add{width:100%;border:1px dashed var(--faint);background:transparent;color:var(--ink);border-radius:10px;padding:10px;font:500 14px var(--body);cursor:pointer;
  margin-top:6px;transition:border-color .2s,background .2s}
.add:hover{border-color:var(--accent);background:var(--accent-soft)}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;transition:transform .3s var(--ease-out)}
.sw:hover{transform:scale(1.12)}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.swatches input[type=color]{width:34px;height:34px;padding:0;border:0;background:none;cursor:pointer}
.ph{display:flex;gap:12px;align-items:center}
.ph img{width:56px;height:70px;object-fit:cover;border-radius:28px 28px 8px 8px}
.newsec{display:flex;gap:8px;margin-top:14px}
.newsec select{flex:1;font:14px var(--body);padding:9px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;transform:translate(-50%,20px);opacity:0;
  background:var(--ink);color:var(--bg);font-size:14px;padding:10px 18px;border-radius:999px;transition:.45s var(--ease-out);pointer-events:none;max-width:90vw;text-align:center}
.toast.show{transform:translate(-50%,0);opacity:1}
.banner{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:45;display:flex;gap:10px;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 16px;font-size:14px;box-shadow:0 10px 30px -14px rgba(0,0,0,.3);max-width:calc(100vw - 24px)}

@media (max-width:820px){
  .body{grid-template-columns:1fr}
  .index{display:none}
  .hero-grid{grid-template-columns:1fr}
  .photo-wrap{order:-1;width:clamp(170px,48vw,220px);justify-self:start;margin:10px 0 8px 18px}
  .tl-item{grid-template-columns:1fr;gap:2px}
  .scroll-cue{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .name .w>span,.fade,.reveal{transform:none!important;opacity:1!important}
  .photo{clip-path:circle(50% at 50% 50%)!important}
  html{scroll-behavior:auto}
}
@media print{
  .dock,.drawer,.scrim,.toast,.banner,.scroll-cue,.index,.bg,.lb,.photo-ring{display:none!important}
  #app{margin:0!important}
  body{background:#fff;color:#000;font-size:11pt}
  .hero{min-height:0;padding:0 0 20px}
  .hero-top{position:static;margin-bottom:24px}
  .name .w>span,.fade,.reveal{transform:none!important;opacity:1!important}
  .photo{clip-path:circle(50% at 50% 50%)!important}
  .body{grid-template-columns:1fr}
  .sec{break-inside:avoid;padding:20px 0 0}
  .tl::after{display:none}
}
</style>

const safeUrl=u=>{u=String(u||'').trim();if(!u)return '';if(/^(https?:|mailto:|tel:)/i.test(u))return u;if(/^[\w.-]+\.[a-z]{2,}/i.test(u))return 'https://'+u;return ''};
const splitList=s=>String(s||'').split(',').map(x=>x.trim()).filter(Boolean);
const $=(s,r=document)=>r.querySelector(s);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Theme ---------- */
function applyAccent(){
  const a=data.theme?.accent||'#3346D3';
  document.documentElement.style.setProperty('--accent-base',a);
  const bgc=BGS[data.theme?.bg]||BGS.lagoon;['--b0','--b1','--b2','--b3','--b4'].forEach((k,i)=>document.documentElement.style.setProperty(k,bgc[i+1]));
  const dark=document.documentElement.dataset.theme==='dark'||(document.documentElement.dataset.theme!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);
  if(!dark) document.documentElement.style.setProperty('--accent',a); else document.documentElement.style.removeProperty('--accent');
}
const savedTheme=store.get(THEME_KEY); if(savedTheme) document.documentElement.dataset.theme=savedTheme;
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',applyAccent);

/* ---------- Render page ---------- */
function words(name){return esc(name||'Your Name').split(/\s+/).filter(Boolean).map((w,i)=>`<span class="w"><span style="transition-delay:${120+i*110}ms">${w}</span></span>`).join(' ')}
function renderSection(s,i){
  let inner='';
  const items=s.items||[];
  if(s.type==='text'){
    const paras=String(s.body||'').split(/\n+/).filter(p=>p.trim());
    inner=paras.length?`<div class="prose">${paras.map(p=>`<p>${esc(p)}</p>`).join('')}</div>`:empty();
  }else if(s.type==='timeline'){
    inner=items.length?`<div class="tl">${items.map(it=>`<div class="tl-item"><div class="tl-when">${esc(it.period)}${it.place?`<span>${esc(it.place)}</span>`:''}</div><div><h3 class="tl-t">${esc(it.title)}</h3>${it.org?`<p class="tl-org">${esc(it.org)}</p>`:''}${it.body?`<p class="tl-body">${esc(it.body)}</p>`:''}</div></div>`).join('')}</div>`:empty();
  }else if(s.type==='projects'){
    inner=items.length?`<div class="pj">${items.map(it=>{const u=safeUrl(it.url);const tag=u?'a':'div';const attrs=u?` href="${esc(u)}" target="_blank" rel="noopener"`:'';
      return `<${tag} class="pj-row"${attrs}><div class="pj-top"><h3 class="pj-t">${esc(it.title)}${u?'<span class="pj-ico" aria-hidden="true">↗</span>':''}</h3><span class="pj-y">${esc(it.year)}</span></div>${it.body?`<p class="pj-b">${esc(it.body)}</p>`:''}${splitList(it.tags).length?`<div class="tags">${splitList(it.tags).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:''}</${tag}>`}).join('')}</div>`:empty();
  }else if(s.type==='gallery'){
    const imgs=items.filter(it=>srcOk(it.src));
    inner=imgs.length?`<div class="gal">${imgs.map((it,k)=>`<button class="gi" style="--k:${k}" data-sec="${esc(s.id)}" data-k="${k}" aria-label="ดูรูป${it.caption?' '+esc(it.caption):''}"><img src="${esc(cld(it.src,900))}" alt="${esc(it.caption)}" loading="lazy">${it.caption||it.date?`<span class="cap">${esc(it.caption)}${it.date?`<small>${esc(it.date)}</small>`:''}</span>`:''}</button>`).join('')}</div>`:empty();
  }else if(s.type==='skills'){
    inner=items.length?`<div class="sk">${items.map(it=>`<div><h3>${esc(it.group)}</h3><ul>${splitList(it.list).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}</div>`:empty();
  }
  return `<section class="sec" id="sec-${esc(s.id)}"><h2 class="sec-h reveal">${esc(s.title||'ไม่มีชื่อ')}</h2><div class="reveal">${inner}</div></section>`;
}
function empty(){return editing?'<p class="empty-note">ส่วนนี้ยังว่างอยู่ เพิ่มรายการได้จากแผงแก้ไข</p>':''}
function hasContent(s){if(s.type==='text')return !!String(s.body||'').trim();if(s.type==='gallery')return s.items.some(it=>srcOk(it.src));return s.items.length>0}

        p.line?`<a class="contact" href="${esc(lineUrl(p.line))}" target="_blank" rel="noopener"><span class="ci">${ICON.line}</span><span><em>LINE</em><strong>${esc(p.line)}</strong></span></a>`:'',

      ].filter(Boolean);return c.length?`<div class="contacts reveal">${c.join('')}</div>`:(editing?'<p class="empty-note" style="margin-top:32px">ใส่เบอร์โทร LINE อีเมล และที่อยู่ได้ในหัวข้อ “ข้อมูลติดต่อ”</p>':'')})()}
      <div class="foot-row"><span>© ${new Date().getFullYear()} ${esc(p.name||'')}</span><span>${esc(p.location||'')}</span></div>
    </footer>
  </div>`;
  if(firstRender){
    firstRender=false;
    requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.add('loaded')));
  }else{
    document.body.classList.add('loaded');
  }
  setupReveal(); setupNav(); onScroll();
}

function setupReveal(){
  revealIO?.disconnect();
  const els=[...document.querySelectorAll('.reveal')];
  if(reduce||editing||!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('in'));return}
  revealIO=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');revealIO.unobserve(e.target)}}),{rootMargin:'0px 0px -12% 0px'});
  els.forEach(e=>revealIO.observe(e));
}

let navIO=null;
function setupNav(){
  navIO?.disconnect();
  const secs=[...document.querySelectorAll('.sec')];
  if(!secs.length||!('IntersectionObserver' in window))return;
  navIO=new IntersectionObserver(es=>{
    es.forEach(e=>{if(e.isIntersecting)setActive(e.target.id.slice(4))});
  },{rootMargin:'-45% 0px -50% 0px'});
  secs.forEach(s=>navIO.observe(s));
  setActive(secs[0].id.slice(4));
}
function setActive(id){
  const links=[...document.querySelectorAll('.index a')];
  const a=links.find(l=>l.dataset.t===id); if(!a)return;
  links.forEach(l=>l.classList.toggle('on',l===a));
  const m=$('.index .mark'); if(m){m.style.transform=`translateY(${a.parentElement.offsetTop}px)`;m.style.height=a.offsetHeight+'px'}
}

let ticking=false;
function onScroll(){
  if(ticking)return; ticking=true;
  requestAnimationFrame(()=>{
    ticking=false;
    const mid=innerHeight*0.6;
    document.querySelectorAll('.tl').forEach(tl=>{
      const r=tl.getBoundingClientRect();
      const p=Math.max(0,Math.min(1,(mid-r.top)/r.height));
      tl.style.setProperty('--p',p.toFixed(3));
      tl.querySelectorAll('.tl-item').forEach(it=>it.classList.toggle('hit',it.getBoundingClientRect().top+10<mid));
    });
  });
}
addEventListener('scroll',onScroll,{passive:true});
addEventListener('resize',()=>{onScroll();const on=$('.index a.on');if(on)setActive(on.dataset.t)});

/* ---------- Lightbox ---------- */
let lbList=[],lbIdx=0,lbReturn=null;
function lbShow(){const it=lbList[lbIdx];if(!it)return;const im=$('#lb-i');im.style.opacity=0;
  im.onload=()=>{im.style.opacity=1};im.src=cld(it.src,1800);im.alt=it.caption||'';
  $('#lb-cap').innerHTML=esc(it.caption)+(it.date?`<small>${esc(it.date)}</small>`:'');$('#lb-c').textContent=`${lbIdx+1} / ${lbList.length}`;
  $('#lb-p').hidden=$('#lb-n').hidden=lbList.length<2}
function lbOpen(list,i,from){lbList=list;lbIdx=i;lbReturn=from;lbShow();const l=$('#lb');l.inert=false;l.classList.add('open');$('#lb-x').focus()}
function lbClose(){const l=$('#lb');l.classList.remove('open');l.inert=true;lbReturn?.focus?.()}
const lbStep=d=>{lbIdx=(lbIdx+d+lbList.length)%lbList.length;lbShow()};
$('#lb-x').onclick=lbClose;$('#lb-p').onclick=()=>lbStep(-1);$('#lb-n').onclick=()=>lbStep(1);
$('#lb').addEventListener('click',e=>{if(e.target.id==='lb')lbClose()});
addEventListener('keydown',e=>{if(!$('#lb').classList.contains('open'))return;if(e.key==='Escape'){e.stopImmediatePropagation();lbClose()}if(e.key==='ArrowLeft')lbStep(-1);if(e.key==='ArrowRight')lbStep(1)},true);
let tx=null;$('#lb').addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
$('#lb').addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50)lbStep(dx<0?1:-1);tx=null});
document.addEventListener('click',e=>{const g=e.target.closest('.gi');if(!g)return;const sec=data.sections.find(x=>x.id===g.dataset.sec);if(!sec)return;
  lbOpen(sec.items.filter(it=>srcOk(it.src)),+g.dataset.k,g)});

let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600)}

$('#b-theme').onclick=()=>{

/* ---------- Editor ---------- */
const getPath=(p)=>p.split('.').reduce((o,k)=>o?.[k],data);
function setPath(p,v){const ks=p.split('.');const last=ks.pop();const o=ks.reduce((o,k)=>o[k],data);o[last]=v}
function fld(label,path,kind){
  const v=esc(getPath(path)??'');
  if(kind==='ta')return `<label class="fld"><span>${label}</span><textarea data-path="${path}" rows="3">${v}</textarea></label>`;
  return `<label class="fld"><span>${label}</span><input data-path="${path}" value="${v}"></label>`;
}
function grp(key,title,extra,inner){
  return `<details class="grp" data-key="${key}" ${openKeys.has(key)?'open':''}><summary>${title}${extra||''}<span class="chev">›</span></summary><div class="grp-in">${inner}</div></details>`;
}

  const body=$('#dr-body'); const st=body.scrollTop;
  const p='profile';
  let h=grp('profile','โปรไฟล์','',`

    ${fld('เมือง / ประเทศ (แสดงด้านบน)','profile.location')}
    ${fld('สถานะ (เว้นว่างเพื่อซ่อน)','profile.availability')}
    <div class="fld"><span>รูปโปรไฟล์</span><div class="ph">${data.profile.photo?`<img src="${esc(data.profile.photo)}" alt="">`:''}
      <label class="ibtn" style="display:inline-block">เลือกรูป<input type="file" accept="image/*" id="photo-in" hidden></label>
      ${data.profile.photo?'<button class="ibtn danger" data-act="photo-del">ลบรูป</button>':''}</div></div>`);
  h+=fbGroup();
  h+=ghGroup();
  h+=grp('contact','ข้อมูลติดต่อ','',`${fld('เบอร์โทรศัพท์','profile.phone')}${fld('LINE ID (เช่น myname หรือ @shopname)','profile.line')}${fld('อีเมล','profile.email')}${fld('ที่อยู่','profile.address','ta')}<p class="hint">ช่องที่เว้นว่างจะไม่แสดงบนหน้าเว็บ ที่อยู่จะกดเปิด Google Maps ได้</p>`);
  h+=grp('links','ลิงก์โซเชียล',`<span class="kind">${data.links.length}</span>`,
    data.links.map((l,i)=>`<div class="item">${fld('ชื่อที่แสดง',`links.${i}.label`)}${fld('URL',`links.${i}.url`)}

async function uploadImage(file){
  const c=data.settings.cloudinary||{};
  if(fbActive()&&!(c.cloud&&c.preset))throw new Error('โหมด Firebase ต้องตั้งค่า Cloudinary ก่อนอัปโหลดรูปกิจกรรม');
  if(!inRuntime&&c.cloud&&c.preset){
    const fd=new FormData();fd.append('file',file);fd.append('upload_preset',c.preset);if(c.folder)fd.append('folder',c.folder);
    const r=await fetch(`https://api.cloudinary.com/v1_1/${encodeURIComponent(c.cloud.trim())}/image/upload`,{method:'POST',body:fd});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.secure_url)throw new Error(j.error?.message||'Cloudinary ตอบกลับผิดพลาด ตรวจสอบ cloud name และ preset');
    return j.secure_url;
  }
  return resize(file,1280);
}
async function download(name,text,type){
  const blob=new Blob([text],{type});
  if(downloadsApi){try{await downloadsApi.save({filename:name,data:blob});return}catch(e){if(e?.code!=='unavailable')return}}
  if(!inRuntime){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);return}
  try{await navigator.clipboard.writeText(text);toast('คัดลอกไปยังคลิปบอร์ดแล้ว')}catch(_){toast('ดาวน์โหลดไม่ได้ในมุมมองนี้')}
}
function resize(file,max){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{
  const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.84))};img.src=r.result};r.readAsDataURL(file)})}
function normalize(j){
  j.settings={...(j.settings||{})};j.settings.github={owner:'',repo:'',branch:'main',path:'',...(j.settings.github||{})};
  j.settings.firebase={apiKey:'',authDomain:'',projectId:'',appId:'',collection:'portfolios',doc:'main',...(j.settings.firebase||{})};
  if(!inRuntime){const d=ghDefaults(),g=j.settings.github;for(const k of ['owner','repo','path'])if(!g[k]&&d[k])g[k]=d[k]}
  j.profile={name:'',role:'',intro:'',location:'',email:'',phone:'',line:'',address:'',availability:'',photo:'',...j.profile};
  j.settings={...(j.settings||{})};j.settings.cloudinary={cloud:'',preset:'',folder:'portfolio',...(j.settings.cloudinary||{})};
  j.links=Array.isArray(j.links)?j.links:[]; j.theme={accent:'#3346D3',bg:'lagoon',...(j.theme||{})};
  j.sections=j.sections.filter(s=>TYPES[s.type]).map((s,i)=>({id:s.id||('s'+i+Date.now().toString(36)),title:'',hidden:false,body:'',items:[],...s}));
  return j;
}

function fbMsg(e){const c=e?.code||'';return ({'auth/popup-blocked':'เบราว์เซอร์บล็อกหน้าต่างเข้าสู่ระบบ อนุญาต popup แล้วลองใหม่','auth/popup-closed-by-user':'ปิดหน้าต่างเข้าสู่ระบบก่อนเสร็จ','auth/unauthorized-domain':'โดเมนนี้ยังไม่ได้เพิ่มใน Firebase → Authentication → Settings → Authorized domains','auth/operation-not-allowed':'ยังไม่ได้เปิด Google sign-in ใน Firebase → Authentication','permission-denied':'ไม่มีสิทธิ์ ตรวจสอบ Firestore rules'})[c]||e?.message||'เกิดข้อผิดพลาด'}
async function fbRead(){
  const c=FB_CFG,ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),6000);
  try{
    const r=await fetch(`https://firestore.googleapis.com/v1/projects/${encodeURIComponent(c.projectId)}/databases/(default)/documents/${encodeURIComponent(c.collection||'portfolios')}/${encodeURIComponent(c.doc||'main')}?key=${encodeURIComponent(c.apiKey)}`,{signal:ctl.signal,cache:'no-store'});
    if(r.status===404)return null;
    if(!r.ok)throw new Error(r.status===403?'อ่านข้อมูลไม่ได้ ตรวจสอบ Firestore rules ให้อ่านได้สาธารณะ':'Firestore '+r.status);
    const j=await r.json();const str=j.fields?.data?.stringValue;return str?JSON.parse(str):null;
  }finally{clearTimeout(t)}
}
async function fbLoad(){
  if(fbx)return fbx;
  const b=`https://www.gstatic.com/firebasejs/${FB_VER}/`;
  const [A,Au,F]=await Promise.all([import(b+'firebase-app.js'),import(b+'firebase-auth.js'),import(b+'firebase-firestore.js')]);
  const app=A.initializeApp({apiKey:FB_CFG.apiKey,authDomain:FB_CFG.authDomain||`${FB_CFG.projectId}.firebaseapp.com`,projectId:FB_CFG.projectId,...(FB_CFG.appId?{appId:FB_CFG.appId}:{})});
  const auth=Au.getAuth(app);if(auth.authStateReady)await auth.authStateReady();
  fbx={Au,F,auth,db:F.getFirestore(app)};
  if(auth.currentUser)fbUserInfo={email:auth.currentUser.email,uid:auth.currentUser.uid};
  return fbx;
}
async function fbSignIn(){
  const x=await fbLoad();
  if(!x.auth.currentUser){const r=await x.Au.signInWithPopup(x.auth,new x.Au.GoogleAuthProvider());fbUserInfo={email:r.user.email,uid:r.user.uid}}
  return x.auth.currentUser;
}
async function fbWrite(d){
  const copy=clone(d);if(copy.settings){delete copy.settings.firebase;delete copy.settings.github}
  const json=JSON.stringify(copy);
  if(json.length>900000)throw new Error('ข้อมูลใหญ่เกิน 1MB (ขีดจำกัดของ Firestore) ย้ายรูปกิจกรรมไปไว้ที่ Cloudinary หรือใช้รูปโปรไฟล์ที่เล็กลง');
  let u;try{u=await fbSignIn()}catch(e){throw new Error('เข้าสู่ระบบไม่สำเร็จ: '+fbMsg(e))}
  try{await fbx.F.setDoc(fbx.F.doc(fbx.db,FB_CFG.collection||'portfolios',FB_CFG.doc||'main'),{data:json,updatedAt:fbx.F.serverTimestamp(),updatedBy:u.uid})}
  catch(e){throw new Error(e?.code==='permission-denied'?`ไม่มีสิทธิ์เขียน ตรวจสอบว่า Firestore rules ใส่ UID ${u.uid} แล้ว`:'บันทึกไม่สำเร็จ: '+fbMsg(e))}
}

    ${fld('apiKey','settings.firebase.apiKey')}${fld('authDomain','settings.firebase.authDomain')}${fld('projectId','settings.firebase.projectId')}${fld('appId','settings.firebase.appId')}
    ${fld('Collection','settings.firebase.collection')}${fld('Document ID','settings.firebase.doc')}
    <p class="hint">ค่าเหล่านี้เปิดเผยได้ ไม่ใช่รหัสลับ ความปลอดภัยควบคุมด้วย Firestore rules ที่ให้เฉพาะบัญชีของคุณเขียนได้ ในโหมดนี้รูปกิจกรรมต้องอัปโหลดผ่าน Cloudinary เพราะเอกสาร Firestore เก็บได้ไม่เกิน 1MB</p>`);
}
document.addEventListener('input',e=>{
  if(e.target.id!=='fb-paste')return;
  const t=e.target.value,f=data.settings.firebase;let n=0;
  for(const k of ['apiKey','authDomain','projectId','appId']){const m=t.match(new RegExp(k+'\\s*["\']?\\s*:\\s*["\']([^"\']+)["\']'));if(m){f[k]=m[1];n++}}
  if(n){changed(true);toast(`อ่านค่าได้ ${n} รายการ`)}
});
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act^="fb-"]');if(!b)return;const a=b.dataset.act;
  if(a==='fb-in'){try{await fbSignIn();renderEditor();toast('เข้าสู่ระบบแล้ว')}catch(err){toast(fbMsg(err))}}
  if(a==='fb-out'){try{await fbx?.Au.signOut(fbx.auth)}catch(_){}fbUserInfo=null;renderEditor()}
  if(a==='fb-rules'){try{await navigator.clipboard.writeText(fbRules(fbUserInfo?.uid));toast('คัดลอก Rules แล้ว นำไปวางใน Firestore → Rules แล้วกด Publish')}catch(_){prompt('คัดลอก Rules นี้',fbRules(fbUserInfo?.uid))}}
});

/* ---------- GitHub publish (for GitHub Pages) ---------- */
const GH_TOKEN_KEY='gh-token-v1';
function strHash(t){let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return (h>>>0).toString(36)+'.'+t.length}
function dataJson(d){return JSON.stringify(d).replace(/</g,'\\u003c')}
function ghDefaults(){
  const m=location.hostname.match(/^([^.]+)\.github\.io$/i);if(!m)return {};
  const owner=m[1],segs=location.pathname.split('/').filter(Boolean);let repo,path;
  if(segs.length&&!/\.html?$/i.test(segs[0])){repo=segs[0];path=segs.slice(1).join('/')}else{repo=owner+'.github.io';path=segs.join('/')}
  if(!path)path='index.html';else if(!/\.html?$/i.test(path))path=path.replace(/\/?$/,'/index.html');
  return {owner,repo,path};
}
const ghToken=()=>store.get(GH_TOKEN_KEY)||'';
function ghReady(){const g=data.settings?.github||{};return !inRuntime&&!!(g.owner&&g.repo&&g.path&&ghToken())}
function ghNote(){if(inRuntime)return;const n=$('#dr-note');if(n)n.textContent=fbActive()?'กดบันทึกเพื่ออัปเดตข้อมูลบน Firebase ทุกคนเห็นข้อมูลใหม่ทันที':ghReady()?'กดบันทึกเพื่ออัปเดตไฟล์บน GitHub ทุกคนจะเห็นภายใน 1–2 นาที':'ยังไม่ได้ตั้งค่า GitHub การบันทึกจะเก็บไว้ในเบราว์เซอร์นี้เท่านั้น ตั้งค่าในหัวข้อ “เผยแพร่ขึ้น GitHub”'}
function b64(str){const b=new TextEncoder().encode(str);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)}
function ghErr(st,j){const m={401:'Token ไม่ถูกต้องหรือหมดอายุ',403:'Token ไม่มีสิทธิ์เขียน repo นี้ (ต้องเปิดสิทธิ์ Contents: Read and write)',404:'ไม่พบ repo, branch หรือไฟล์ ตรวจสอบชื่อให้ถูกต้อง',409:'ไฟล์ถูกแก้ไขพร้อมกัน ลองบันทึกอีกครั้ง',422:'ข้อมูลไม่ถูกต้อง ลองบันทึกอีกครั้ง'};return new Error(m[st]||j.message||('GitHub error '+st))}
function ghHeaders(){return {Authorization:'Bearer '+ghToken(),Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}}
async function ghPublish(html){
  const g=data.settings.github,br=g.branch||'main';
  const url=`https://api.github.com/repos/${encodeURIComponent(g.owner.trim())}/${encodeURIComponent(g.repo.trim())}/contents/${g.path.trim().replace(/^\/+/,'').split('/').map(encodeURIComponent).join('/')}`;
  let sha;
  const r0=await fetch(`${url}?ref=${encodeURIComponent(br)}&_=${Date.now()}`,{headers:ghHeaders(),cache:'no-store'});
  if(r0.ok)sha=(await r0.json()).sha;else if(r0.status!==404)throw ghErr(r0.status,await r0.json().catch(()=>({})));
  const r=await fetch(url,{method:'PUT',headers:{...ghHeaders(),'Content-Type':'application/json'},
    body:JSON.stringify({message:'อัปเดตเนื้อหาผ่านหน้าแก้ไข',content:b64(html),sha,branch:br})});
  if(!r.ok)throw ghErr(r.status,await r.json().catch(()=>({})));
}
async function ghTest(){
  const g=data.settings.github;if(!g.owner||!g.repo){toast('ใส่ชื่อบัญชีและชื่อ repo ก่อน');return}if(!ghToken()){toast('ใส่ Token ก่อน');return}
  try{const r=await fetch(`https://api.github.com/repos/${encodeURIComponent(g.owner.trim())}/${encodeURIComponent(g.repo.trim())}`,{headers:ghHeaders(),cache:'no-store'});
    const j=await r.json().catch(()=>({}));if(!r.ok)throw ghErr(r.status,j);
    toast(j.permissions&&j.permissions.push===false?'เชื่อมต่อได้ แต่ Token นี้ไม่มีสิทธิ์เขียน':'เชื่อมต่อสำเร็จ พร้อมบันทึกขึ้น GitHub')}catch(e){toast('เชื่อมต่อไม่สำเร็จ: '+e.message)}
}
function ghGroup(){
  if(inRuntime)return '';
  const t=ghToken();
  return grp('github','เผยแพร่ขึ้น GitHub',ghReady()?'<span class="kind">พร้อมใช้งาน</span>':'<span class="hid">ยังไม่ได้ตั้งค่า</span>',`
    ${fld('ชื่อบัญชี GitHub (owner)','settings.github.owner')}${fld('ชื่อ repo','settings.github.repo')}${fld('Branch','settings.github.branch')}${fld('ไฟล์ที่จะอัปเดต','settings.github.path')}
    <label class="fld"><span>Personal access token</span><input type="password" id="gh-token" value="${esc(t)}" autocomplete="off" placeholder="github_pat_…"></label>
    <div class="row"><button class="ibtn" data-act="gh-test">ทดสอบการเชื่อมต่อ</button>${t?'<button class="ibtn danger" data-act="gh-forget">ลบ Token ออกจากเครื่องนี้</button>':''}</div>
    <p class="hint">Token จะเก็บไว้ในเบราว์เซอร์เครื่องนี้เท่านั้น ไม่ถูกบันทึกลงไฟล์ สร้างได้ที่ GitHub → Settings → Developer settings → Fine-grained tokens เลือกเฉพาะ repo นี้ และให้สิทธิ์ Contents: Read and write</p>`);
}
document.addEventListener('input',e=>{if(e.target.id==='gh-token'){store.set(GH_TOKEN_KEY,e.target.value.trim());ghNote()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act^="gh-"]');if(!b)return;
  if(b.dataset.act==='gh-test')ghTest();
  if(b.dataset.act==='gh-forget'){store.del(GH_TOKEN_KEY);renderEditor();toast('ลบ Token แล้ว')}});

/* ---------- Save ---------- */
function buildDocument(d){
  const json=JSON.stringify(d).replace(/</g,'\\u003c');
  return '<!DOCTYPE html>\n<html lang="th">\n<head>\n'+HEAD_SRC+'\n</head>\n<body>\n<div id="app"></div>\n'
    +'<script type="application/json" id="resume-data" data-keep>'+json+'<\/script>\n'+MAIN_SRC+'\n</body>\n</html>';
}
let saving=false;
async function save(){
  if(saving)return;
  if(!dirty()){toast('ไม่มีการเปลี่ยนแปลง');return}
  saving=true; const btn=$('#b-save'); btn.textContent='กำลังบันทึก…';
  const done=(msg)=>{saving=false;btn.textContent='บันทึก';if(msg)toast(msg)};
  if(artifactApi&&!readOnly){
    try{
      await artifactApi.publish(buildDocument(data));
      saved=clone(data); store.del(LOCAL_KEY); done('บันทึกแล้ว'); setEditing(false); return;
    }catch(e){
      const c=e?.code;
      if(c==='conflict'){done('มีเวอร์ชันใหม่กว่านี้ถูกบันทึกไปก่อน กำลังโหลดเวอร์ชันล่าสุด ร่างของคุณยังเก็บไว้');return}
      if(c==='not_writer'||c==='not_granted'||c==='not_declared'||c==='consent_required'){readOnly=true}
      else if(c==='too_large'){done('ข้อมูลใหญ่เกินไป ลองใช้รูปที่เล็กลง');return}
      else if(c==='rate_limited'){done('บันทึกถี่เกินไป รอสักครู่แล้วลองอีกครั้ง');return}
      else {done('บันทึกไม่สำเร็จ ลองอีกครั้ง');return}
    }
  }
  if(fbActive()){
    try{await fbWrite(data);saved=clone(data);store.del(LOCAL_KEY);store.del(DRAFT_KEY);fbStatus='ok';done('บันทึกขึ้น Firebase แล้ว ทุกคนเห็นข้อมูลใหม่ทันที');setEditing(false);return}
    catch(e){done(e.message);return}
  }
  if(!inRuntime&&ghReady()){
    const html=buildDocument(data);
    try{await ghPublish(html);
      store.set(LOCAL_KEY,JSON.stringify({base:strHash(dataJson(data)),oldBase:window.__pubHash,pending:true,data}));
      saved=clone(data);store.del(DRAFT_KEY);done('บันทึกขึ้น GitHub แล้ว หน้าเว็บจะอัปเดตภายใน 1–2 นาที');setEditing(false);return}
    catch(e){done('บันทึกขึ้น GitHub ไม่สำเร็จ: '+e.message);return}
  }
  store.set(LOCAL_KEY,JSON.stringify({base:window.__pubHash,data}));saved=clone(data);store.del(DRAFT_KEY);
  done('บันทึกไว้ในเบราว์เซอร์นี้เท่านั้น ตั้งค่า “เผยแพร่ขึ้น GitHub” เพื่อให้ทุกคนเห็น');setEditing(false);
}

/* ---------- Draft recovery ---------- */
function checkDraft(){
  const d=store.get(DRAFT_KEY); if(!d)return;
  if(d===JSON.stringify(saved)){store.del(DRAFT_KEY);return}
  const bar=document.createElement('div');bar.className='banner';
  bar.innerHTML='<span>มีร่างที่ยังไม่ได้บันทึก</span><button class="ibtn" id="dr-x">ทิ้ง</button><button class="dbtn primary" id="dr-r" style="padding:8px 14px">กู้คืน</button>';
  document.body.appendChild(bar);
  $('#dr-x').onclick=()=>{store.del(DRAFT_KEY);bar.remove()};
  $('#dr-r').onclick=()=>{try{data=normalize(JSON.parse(d))}catch(e){}bar.remove();setEditing(true)};
}

/* ---------- Boot ---------- */
data=normalize(data); saved=normalize(clone(saved));
(async()=>{
  await fbBoot();
  render();
  const C=window.claude;
  if(C&&C.use){
    const [art,usr,dl]=await Promise.all([C.use('artifact').catch(()=>null),C.use('user').catch(()=>null),C.use('downloads').catch(()=>null)]);
    artifactApi=art; downloadsApi=dl;
    if(usr){try{canEdit=await usr.canEdit()}catch(e){canEdit=false}}
    else canEdit=!!art;
  }else{
    // On your own hosting the edit button stays hidden: add #edit to the URL to open it
    canEdit=/(^|[#?&])edit\b/.test(location.hash+location.search);
  }
  $('#b-edit').hidden=!canEdit;
  if(canEdit)checkDraft();
})();
addEventListener('hashchange',()=>{if(!inRuntime&&/edit/.test(location.hash)){canEdit=true;$('#b-edit').hidden=false;setEditing(true)}});
})();
</script>
